[package]
name = "moonrush-launcher"
version = "0.4.0"
edition = "2021"
description = "Moonrush launcher for Super Mario Odyssey on Ryujinx"

[lib]
name = "moonrush_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
